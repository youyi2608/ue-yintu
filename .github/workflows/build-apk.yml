name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          echo "build-tools=$BT"
          echo "platform=$PLAT"
          rm -rf build && mkdir -p build/classes build/dex
          find android/app/src/main/java -name '*.java' > build/srcs.txt
          javac -source 8 -target 8 -bootclasspath "$PLAT/android.jar" -d build/classes @build/srcs.txt
          "$BT/d8" --lib "$PLAT/android.jar" --min-api 24 --output build/dex $(find build/classes -name '*.class')
          "$BT/aapt2" compile --dir android/app/src/main/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PLAT/android.jar" \
            -A android/app/src/main/assets \
            --manifest android/app/src/main/AndroidManifest.xml \
            --min-sdk-version 24 --target-sdk-version 34 build/res.zip
          cd build && mkdir -p unz && cd unz && unzip -o -q ../base.apk && cp ../dex/classes.dex classes.dex && zip -q -r ../unsigned.apk . && cd ..
          keytool -genkeypair -keystore ks.jks -storepass ueyintu -keypass ueyintu -alias ue -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ue-yintu" >/dev/null 2>&1
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:ueyintu --key-pass pass:ueyintu --out ue-yintu.apk unsigned.apk
          "$BT/apksigner" verify ue-yintu.apk
          ls -l ue-yintu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ue-yintu-apk
          path: build/ue-yintu.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ue隐图 APK ${{ github.run_number }}
          body: "由 GitHub Actions 自动编译的安卓版 ue隐图。"
          files: build/ue-yintu.apk