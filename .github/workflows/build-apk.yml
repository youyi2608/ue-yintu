name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -1)
          echo "build-tools=$BT"
          echo "platform=$PLAT"
          rm -rf build && mkdir -p build/classes build/dex
          find android/app/src/main/java -name '*.java' > build/srcs.txt
          javac -source 8 -target 8 -bootclasspath "$PLAT/android.jar" -d build/classes @build/srcs.txt
          "$BT/d8" --lib "$PLAT/android.jar" --min-api 24 --output build/dex $(find build/classes -name '*.class')
          "$BT/aapt2" compile --dir android/app/src/main/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PLAT/android.jar" \
            -A android/app/src/main/assets \
            --manifest android/app/src/main/AndroidManifest.xml \
            --min-sdk-version 24 --target-sdk-version 34 build/res.zip
          python3 tools/mkzip.py build/base.apk build/dex/classes.dex build/withdex.apk
          "$BT/zipalign" -f -p 4 build/withdex.apk build/aligned.apk
          keytool -genkeypair -keystore build/ks.jks -storepass ueyintu -keypass ueyintu -alias ue -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ue-yintu" >/dev/null 2>&1
          "$BT/apksigner" sign --ks build/ks.jks --ks-pass pass:ueyintu --key-pass pass:ueyintu \
            --min-sdk-version 24 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/ue-yintu.apk build/aligned.apk
          "$BT/apksigner" verify --print-certs -v build/ue-yintu.apk | head -25
          python3 -c "import zipfile;z=zipfile.ZipFile('build/ue-yintu.apk');print('arsc_method',[(i.compress_type) for i in z.infolist() if i.filename=='resources.arsc'])"
          ls -l build/ue-yintu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ue-yintu-apk
          path: build/ue-yintu.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ue隐图 APK ${{ github.run_number }}
          body: "由 GitHub Actions 自动编译的安卓版 ue隐图。"
          files: build/ue-yintu.apk